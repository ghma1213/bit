services:
  db:
    image: postgres:17-alpine
    container_name: bit-postgres
    environment:
      POSTGRES_USER: bit
      POSTGRES_PASSWORD: bit_dev_password
      POSTGRES_DB: bit
    ports:
      - '5433:5432'
    volumes:
      - bit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bit -d bit']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bit-pgdata:
